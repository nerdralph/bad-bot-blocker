<IfModule mod_ssl.c>
<VirtualHost *:443>
  Define DOC_ROOT /var/www/solarsi.ca/html

  ServerName solarsi.ca
  ServerAlias www.solarsi.ca
  DocumentRoot "${DOC_ROOT}"

  # support HSTS
  Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

  # bad bots can blast a server with 100+ requests
  # limit each H2 connection to 4 requests
  H2MaxSessionStreams 4

  # LogLevel warn ssl:debug
  ErrorLog ${APACHE_LOG_DIR}/solarsi.ca-error.log
  CustomLog ${APACHE_LOG_DIR}/solarsi.ca-access.log combined
  CustomLog ${APACHE_LOG_DIR}/solarsi-fingerprint.log botfingerprint
  
  # Syslog target for fail2ban
  CustomLog "|/usr/bin/logger -p local1.info -t apache2" combined

  # MultiViews and encoding mappings
  AddEncoding br .br
  AddType text/html .html.br
  RemoveType .gz
  AddEncoding gzip .gz

  # challenge page served as the body of the 403 from the cookie rule
  ErrorDocument 403 /challenge.html

  RewriteMap crawler_check prg:/usr/local/bin/crawler_check.py
  RewriteEngine On

  # Public files: exempt from all checks
  RewriteRule ^/(robots\.txt|.*\.ico)$ - [L]

  # Google, Bing, or FaceBook
  Define BOT_UA_PATTERN "(Googlebot|bingbot|externalhit_ua)"
  
  # Verified claimed crawler: bypass Brotli and cookie checks entirely
  RewriteCond %{HTTP_USER_AGENT} ${BOT_UA_PATTERN} [NC]
  RewriteCond ${crawler_check:%{REMOTE_ADDR},%1} =1
  RewriteRule ^ - [L]
  
  # Claimed crawler: reject if it was not verified
  RewriteCond %{HTTP_USER_AGENT} ${BOT_UA_PATTERN} [NC]
  RewriteRule ^ - [R=429,L]

  # TEMPORARY: UA-only whitelist for link preview fetchers (Google Messages,
  # iMessage, WhatsApp).  Collecting data on their request behavior.
  RewriteCond %{HTTP_USER_AGENT} (Twitterbot/1\.0|WhatsApp/2)
  RewriteRule ^ - [L]
  
  # Brotli required except for link previews like Twitterbot
  RewriteCond %{HTTP:Accept-Encoding} !\bbr\b [NC]
  RewriteCond %{HTTP_USER_AGENT} !Twitterbot [NC]
  RewriteRule ^ - [R=406,L]

  # Reject HTTP/1.1.  Browsers use HTTP/2
  RewriteCond %{SERVER_PROTOCOL} ^HTTP/1\.1$
  RewriteRule ^ - [R=505,L]

  # Challenge requires HTML rendering, handling a meta refresh
  # bbb_pass appears only in the challenge page's meta refresh,
  # so a request carrying it has rendered the body.
  Define BBB_PASS_RE "(^|&)bbb_pass=1(&|$)"
  Define BOT_COOKIE fu_bots
  RewriteCond %{REQUEST_URI} !\.(png|jpe?g|jxl|gif|svg|webp|avif|ico|css|js|woff2?)$ [NC]
  RewriteCond %{REQUEST_URI} !^/challenge\.html$ [NC]
  RewriteCond %{HTTP_COOKIE} !(^|;\s*)BadBotBlock=${BOT_COOKIE}(;|$)
  RewriteCond %{QUERY_STRING} !${BBB_PASS_RE}
  RewriteRule ^ - [F]

  # Set the pass cookie only on the refresh request, so storing cookies
  # without parsing the body is not enough to get past the rule above.
  Header always set Set-Cookie "BadBotBlock=${BOT_COOKIE}; path=/; max-age=432000" "expr=%{QUERY_STRING} =~ /${BBB_PASS_RE}/"

  <Directory "${DOC_ROOT}">
      Options -Indexes +MultiViews
      RemoveLanguage .br
  </Directory>

  <Directory "${DOC_ROOT}/portfolio">
      Options +Indexes
  </Directory>

  Include /etc/letsencrypt/options-ssl-apache.conf
  # restrict SSL to TLSv1.3
  SSLProtocol -all +TLSv1.3
  SSLCertificateFile /etc/letsencrypt/live/solarsi.ca/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/solarsi.ca/privkey.pem
</VirtualHost>
</IfModule>

# vim: syntax=apache ts=4 sw=4 sts=4 sr noet
